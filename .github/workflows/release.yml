name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./... -race

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for pair in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            name="claude-config_${VERSION}_${os}_${arch}"
            echo "Building ${name}..."
            GOOS="${os}" GOARCH="${arch}" go build \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/claude-config" ./cmd/claude-config
            tar -czf "dist/${name}.tar.gz" -C dist claude-config
            rm dist/claude-config
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz --generate-notes
